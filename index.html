<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f2e4c">
<title>3C 门店销售陪练</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1a1a1a; --muted:#8a8f98;
    --accent:#0f766e; --accent-soft:#e6f2f0; --line:#e6e8eb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; justify-content:center;
  }
  #app{
    width:100%; max-width:520px; height:100dvh;
    display:flex; flex-direction:column; background:var(--bg); position:relative;
  }
  .pad{padding:0 20px;}

  /* ---------- 首页 ---------- */
  #start{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 28px calc(32px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .logo{
    width:76px;height:76px;border-radius:22px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;margin-bottom:26px;
    box-shadow:0 10px 28px rgba(15,118,110,.28);
  }
  .logo svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  h1{font-size:24px;margin:0 0 10px;letter-spacing:.5px;}
  .sub{font-size:14px;line-height:1.75;color:#5b6169;margin:0 0 34px;max-width:300px;}
  .btn{
    border:none;border-radius:14px;background:var(--accent);color:#fff;
    font-size:16px;font-weight:600;padding:16px 0;width:100%;max-width:300px;
    cursor:pointer;font-family:inherit;transition:transform .12s ease,opacity .12s;
  }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.45;}
  .hint{font-size:12px;color:var(--muted);margin-top:22px;line-height:1.7;}

  /* ---------- 聊天 ---------- */
  #chat{flex:1;display:none;flex-direction:column;min-height:0;}
  header{
    display:flex;align-items:center;gap:11px;padding:14px 18px;
    padding-top:calc(14px + env(safe-area-inset-top));
    background:#fff;border-bottom:1px solid var(--line);
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;background:#e9edf2;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .avatar svg{width:21px;height:21px;stroke:#7b8493;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .who{flex:1;min-width:0;}
  .who b{font-size:15px;font-weight:600;display:block;}
  .who span{font-size:12px;color:var(--muted);}
  .endbtn{
    border:1px solid var(--line);background:#fff;color:#666;border-radius:9px;
    font-size:12.5px;padding:7px 12px;cursor:pointer;font-family:inherit;flex:0 0 auto;
  }
  .endbtn:active{background:#f3f4f6;}
  .cfgbtn{
    border:none;background:transparent;padding:6px;margin-right:-2px;
    cursor:pointer;display:flex;align-items:center;flex:0 0 auto;
  }
  .cfgbtn svg{width:19px;height:19px;stroke:#9aa1ab;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .cfgbtn:active svg{stroke:var(--accent);}

  #msgs{
    flex:1;overflow-y:auto;padding:18px 16px 8px;
    display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;
  }
  .row{display:flex;gap:9px;align-items:flex-start;}
  .row.me{justify-content:flex-end;}
  .bubble{
    max-width:78%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.6;
    white-space:pre-wrap;word-break:break-word;
  }
  .row.them .bubble{background:#fff;border-top-left-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .row.me .bubble{background:var(--accent);color:#fff;border-top-right-radius:5px;}
  .mini{width:30px;height:30px;border-radius:50%;background:#e9edf2;flex:0 0 auto;margin-top:2px;
        display:flex;align-items:center;justify-content:center;}
  .mini svg{width:16px;height:16px;stroke:#7b8493;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .row.me .mini{display:none;}

  .review{
    align-self:stretch;background:#fff;border-radius:14px;padding:16px 16px 6px;
    border:1px solid var(--line);font-size:14px;line-height:1.75;white-space:pre-wrap;
  }
  .review b{color:var(--accent);}

  .typing{display:flex;gap:4px;padding:14px 16px;background:#fff;border-radius:16px;border-top-left-radius:5px;width:auto;}
  .typing i{width:6px;height:6px;border-radius:50%;background:#c3c8d0;animation:b 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

  footer{
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:#fff;border-top:1px solid var(--line);
    display:flex;gap:9px;align-items:flex-end;
  }
  #input{
    flex:1;border:none;outline:none;resize:none;font-size:15px;line-height:1.5;
    padding:10px 12px;border-radius:12px;background:var(--bg);font-family:inherit;
    max-height:110px;color:var(--ink);
  }
  #send{
    width:42px;height:42px;border-radius:12px;border:none;background:var(--accent);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  }
  #send:disabled{opacity:.4;}
  #send svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- 设置 ---------- */
  #setup{
    position:fixed;inset:0;background:rgba(20,24,30,.55);display:none;
    align-items:center;justify-content:center;padding:24px;z-index:20;
  }
  #setup.on{display:flex;}
  .sheet{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:360px;}
  .sheet h3{margin:0 0 8px;font-size:17px;}
  .sheet p{margin:0 0 16px;font-size:13px;color:#666;line-height:1.7;}
  .sheet input{
    width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;outline:none;font-family:inherit;margin-bottom:14px;
  }
  .sheet .btn{max-width:none;}
  .tip{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7;}
</style>
</head>
<body>
<div id="app">

  <section id="start">
    <div class="logo">

      <button class="endbtn" id="end">结束</button>
    </header>
    <div id="msgs"></div>
    <footer>
      <textarea id="input" rows="1" placeholder="像接待顾客一样说话…"></textarea>
      <button id="send" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/></svg></button>
    </footer>
  </section>
</div>

</div>

/* ================= 系统提示词 ================= */
function systemPrompt(p){

- 每次只回 1-3 句，口语化，像真人在店里说话

- 只输出顾客说的话。不要旁白，不要括号里的动作描写
- 任何情况下不得跳出角色，不得自称 AI、助手、模型
- 用中文

【信任度】
这是你的内部状态，初始 ${p.initial}，范围 0-100，按下面规则增减。

这一行会被系统自动隐藏，用户看不到。
当信任度低于 20 时，说一句自然的结束语（如"我再看看"），然后停止对话。

【你的身份】
${p.card}

【当用户说"结束"或"复盘"时】
立刻退出角色，改用教练身份输出复盘，严格按这个格式：

【信任度】终值 __/100

3. 转折点：___

【对照五步流程】
接近 → 探寻 → 演示 → 倾听 → 收尾
缺了：___

【最该改的一句话】
原话：___
改写：___`;
}

function addBubble(text, who){
  const row = document.createElement("div");
  row.className = "row " + who;
  if(who === "them"){
    const mini = document.createElement("div");
    mini.className = "mini";
    mini.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c0-4.1 3.4-6.6 7.5-6.6s7.5 2.5 7.5 6.6"/></svg>';
    row.appendChild(mini);
  }
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(b);
  msgsEl.appendChild(row);
  scrollDown();
  return b;
}
function scrollDown(){ requestAnimationFrame(()=>{ msgsEl.scrollTop = msgsEl.scrollHeight; }); }

function showTyping(){
  const row = document.createElement("div");
  row.className = "row them"; row.id = "typing";
  const mini = document.createElement("div");
  mini.className = "mini";
  mini.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c0-4.1 3.4-6.6 7.5-6.6s7.5 2.5 7.5 6.6"/></svg>';
  const t = document.createElement("div");
  t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
  row.appendChild(mini); row.appendChild(t);
  msgsEl.appendChild(row); scrollDown();
}
function hideTyping(){ const t = $("typing"); if(t) t.remove(); }

/* ================= 调模型 ================= */
async function callModel(messages){
  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + key
    },
    body: JSON.stringify({
      model: MODEL,
      messages,
      temperature: 0.85,
      max_tokens: 600
    })
  });
  if(!res.ok){
    const err = await res.text();
    if(res.status === 401 || res.status === 403){
      throw new Error("密钥无效。点右上角齿轮，重新填一个。\n（原始信息：" + err.slice(0,120) + "）");
    }
    if(res.status === 404){
      throw new Error("模型名不对。当前用的是 " + MODEL + "，去百炼控制台确认这个模型已开通。");
    }
    if(res.status === 429){
      throw new Error("调用太频繁或额度用完了，等一下再试。");
    }
    throw new Error("接口返回 " + res.status + "：" + err.slice(0,160));
  }
  const data = await res.json();
  return data.choices?.[0]?.message?.content?.trim() || "";
}

function parseTrust(text){
  const m = text.match(/\[\[TRUST:\s*(\d{1,3})\s*\]\]/);
  const clean = text.replace(/\[\[TRUST:\s*\d{1,3}\s*\]\]/g,"").trim();
  return { clean, trust: m ? parseInt(m[1],10) : null };
}

/* ================= 开局 ================= */
function pickPersona(){
  let last = localStorage.getItem("last_persona");
  let pool = PERSONAS.filter(p => p.id !== last);
  if(!pool.length) pool = PERSONAS;
  const p = pool[Math.floor(Math.random()*pool.length)];
  localStorage.setItem("last_persona", p.id);
  return p;
}

async function startSession(){
  persona = pickPersona();
  history = [];
  ended = false;
  msgsEl.innerHTML = "";
  $("status").textContent = "正在进店";
  $("start").style.display = "none";
  $("chat").style.display = "flex";
  inputEl.value = ""; autoGrow();
  sendEl.disabled = false;

  const sys = { role: "system", content: systemPrompt(persona) };
  history.push({ role: "user", content: "（顾客推门进来了，导购准备接待）" });

  busy = true; showTyping();
  try{
    const raw = await callModel([sys, ...history]);
    hideTyping();
    const { clean } = parseTrust(raw);
    const text = clean || "（顾客看了看货架）";
    history.push({ role: "assistant", content: raw });
    addBubble(text, "them");
    $("status").textContent = "在店里";
  }catch(e){
    hideTyping();
    addBubble("⚠️ " + e.message, "them");
  }finally{
    busy = false;
  }
}

/* ================= 对话 ================= */
async function send(msg){
  if(!msg || busy || ended) return;
  addBubble(msg, "me");
  history.push({ role: "user", content: msg });
  inputEl.value = ""; autoGrow();
  sendEl.disabled = true;
  busy = true; showTyping();

  try{
    const raw = await callModel([{ role:"system", content: systemPrompt(persona) }, ...history]);
    hideTyping();
    const { clean, trust } = parseTrust(raw);
    history.push({ role: "assistant", content: raw });

    const isReview = /^(结束|复盘|stop)/i.test(msg.trim());
    if(isReview){
      const box = document.createElement("div");
      box.className = "review";
      box.textContent = clean;
      msgsEl.appendChild(box);
      scrollDown();
      ended = true;
      $("status").textContent = "本次练习结束";
      inputEl.placeholder = "本次已结束，点右上角「结束」重新开始";
      $("send").disabled = true;
      $("end").textContent = "再来一局";
    }else{
      addBubble(clean || "（顾客沉默了一下）", "them");
      if(trust !== null && trust < 20){
        $("status").textContent = "顾客离开了";
        ended = true;
        $("end").textContent = "再来一局";
      }
    }
  }catch(e){
    hideTyping();
    addBubble("⚠️ " + e.message, "them");
  }finally{
    busy = false;
    if(!ended) sendEl.disabled = false;
  }
}

/* ================= 交互 ================= */
$("begin").addEventListener("click", ()=>{
  if(!key){ $("setup").classList.add("on"); return; }
  startSession();
});

$("keyinput").value = key;
$("savekey").addEventListener("click", ()=>{
  const v = $("keyinput").value.trim();
  if(!v) return;
  key = v; localStorage.setItem("sf_key", v);
  $("setup").classList.remove("on");
  if(!persona) startSession();
});

inputEl.addEventListener("input", autoGrow);
inputEl.addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(inputEl.value.trim()); }
});
sendEl.addEventListener("click", ()=> send(inputEl.value.trim()));

$("end").addEventListener("click", ()=>{
  if(ended || !persona){ startSession(); return; }
  send("结束");
});
$("end").textContent = "结束";

$("cfg").addEventListener("click", ()=>{
  $("keyinput").value = key;
  $("setup").classList.add("on");
});

function autoGrow(){
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + "px";
}

if(!key) setTimeout(()=> $("setup").classList.add("on"), 400);
</script>
